<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --accent: #00D4FF;
  --accent2: #FF3D8A;
  --accent3: #FFB800;
  --bg: #F7F9FC;
  --card: #FFFFFF;
  --glass: rgba(255,255,255,0.82);
  --text: #0F172A;
  --muted: #64748B;
  --border: #E2E8F0;
}
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: linear-gradient(160deg, #E0F2FE 0%, #F7F9FC 40%, #FCE7F3 100%);
  min-height: 100vh; color: var(--text);
}
.app {
  max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg);
  box-shadow: 0 0 60px rgba(0,0,0,.08); position: relative; overflow: hidden;
}
.header {
  padding: 20px 18px 12px; background: var(--glass); backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border);
}
.header h1 { font-family: 'Space Grotesk'; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.header h1 i { color: var(--accent); }
.sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.chip {
  background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; color: var(--muted);
}
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,212,255,.35); }
.sort-select { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px;
}
.media-card {
  aspect-ratio: 1; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer;
  background: #e2e8f0; transition: transform .25s, box-shadow .25s;
}
.media-card:hover { transform: scale(1.04); z-index: 2; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; }
.video-badge {
  position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.7); color: #fff;
  font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 700;
}
.folder-card {
  aspect-ratio: 1; border-radius: 12px; background: linear-gradient(145deg, #fff, #f1f5f9);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); cursor: pointer; font-weight: 700; font-size: 13px;
}
.folder-card i { font-size: 28px; color: var(--accent); }
.lightbox, .video-modal, .info-modal, .share-sheet {
  position: fixed; inset: 0; background: rgba(15,23,42,.85); backdrop-filter: blur(16px);
  z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column;
}
.lightbox.active, .video-modal.active, .info-modal.active, .share-sheet.active { display: flex; }
.lightbox-img {
  max-width: 95%; max-height: 75vh; border-radius: 16px; transition: transform .3s; cursor: zoom-in;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.zoom-controls { display: flex; gap: 12px; margin-top: 16px; }
.zoom-controls button, .action-btn {
  background: var(--glass); border: none; width: 48px; height: 48px; border-radius: 50%;
  font-size: 18px; cursor: pointer; color: var(--text); backdrop-filter: blur(10px);
}
.video-player {
  width: 95%; max-width: 420px; border-radius: 16px; overflow: hidden; background: #000; position: relative;
}
.video-player video { width: 100%; height: auto; max-height: 70vh; }
.gesture-zones { position: absolute; inset: 0; display: flex; }
.zone { flex: 1; }
.zone.left { background: linear-gradient(to right, rgba(255,255,255,.08), transparent); }
.zone.right { background: linear-gradient(to left, rgba(255,255,255,.08), transparent); }
.progress { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(255,255,255,.3); }
.progress-fill { height: 100%; background: var(--accent); width: 0%; }
.sheet {
  background: #fff; border-radius: 28px 28px 0 0; padding: 20px; width: 100%; max-width: 480px;
  position: absolute; bottom: 0; animation: slideUp .3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.share-options { display: flex; gap: 16px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
.share-opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
}
.share-opt div {
  width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
}
.wa { background: #25D366; } .fb { background: #1877F2; } .tt { background: #000; } .other { background: var(--accent); }
.info-content { background: #fff; border-radius: 20px; padding: 20px; max-width: 360px; width: 90%; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
@media (max-width: 480px) {
  .app { max-width: 100%; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 3px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1><i class="fa-solid fa-images"></i> Lumina Gallery</h1>
    <div class="sub">Most recent • Storage access granted</div>
    <div class="controls">
      <div class="chip active" data-filter="all">All</div>
      <div class="chip" data-filter="photos">Photos</div>
      <div class="chip" data-filter="videos">Videos</div>
      <div class="chip" data-filter="folders">Folders</div>
      <select class="sort-select" id="sortSelect">
        <option value="recent">Sort: Recent</option>
        <option value="oldest">Sort: Oldest</option>
        <option value="name">Sort: Name</option>
      </select>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox">
  <img class="lightbox-img" id="lbImg" alt="">
  <div class="zoom-controls">
    <button onclick="zoom(1.2)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
    <button onclick="zoom(0.8)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
    <button onclick="resetZoom()"><i class="fa-solid fa-compress"></i></button>
    <button onclick="showInfo()"><i class="fa-solid fa-info"></i></button>
    <button onclick="openShare()"><i class="fa-solid fa-share"></i></button>
    <button onclick="closeAll()"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<!-- Video Modal -->
<div class="video-modal" id="videoModal">
  <div class="video-player">
    <video id="vidPlayer" controls playsinline></video>
    <div class="gesture-zones">
      <div class="zone left" title="Brightness"></div>
      <div class="zone right" title="Volume"></div>
    </div>
    <div class="progress"><div class="progress-fill" id="prog"></div></div>
  </div>
  <div class="zoom-controls" style="margin-top:12px;">
    <button onclick="vidZoom(1.1)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
    <button onclick="showInfo()"><i class="fa-solid fa-info"></i></button>
    <button onclick="openShare()"><i class="fa-solid fa-share"></i></button>
    <button onclick="closeAll()"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<!-- Info Modal -->
<div class="info-modal" id="infoModal">
  <div class="info-content">
    <h3 style="margin-bottom:10px;">File Info</h3>
    <div id="infoBody" style="font-size:14px; line-height:1.6;"></div>
    <button class="action-btn" style="margin:16px auto 0; display:block;" onclick="closeAll()">Close</button>
  </div>
</div>

<!-- Share Sheet -->
<div class="share-sheet" id="shareSheet">
  <div class="sheet">
    <h3 style="text-align:center; margin-bottom:8px;">Share from Lumina Ultra Camera Gallery</h3>
    <p style="text-align:center; font-size:13px; color:var(--muted);">Caption will include: “Shared from Lumina Ultra Camera Gallery”</p>
    <div class="share-options">
      <div class="share-opt" onclick="quickShare('whatsapp')"><div class="wa"><i class="fa-brands fa-whatsapp"></i></div>WhatsApp</div>
      <div class="share-opt" onclick="quickShare('facebook')"><div class="fb"><i class="fa-brands fa-facebook"></i></div>Facebook</div>
      <div class="share-opt" onclick="quickShare('tiktok')"><div class="tt"><i class="fa-brands fa-tiktok"></i></div>TikTok</div>
      <div class="share-opt" onclick="quickShare('native')"><div class="other"><i class="fa-solid fa-share-nodes"></i></div>More</div>
    </div>
    <button class="action-btn" style="margin:10px auto; display:block;" onclick="closeAll()">Cancel</button>
  </div>
</div>

<script>
const sampleMedia = [
  {id:1, type:'photo', name:'Sunset Peak', date:'2026-10-09', size:'4.2 MB', folder:'Travel', url:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80'},
  {id:2, type:'photo', name:'City Night', date:'2026-10-08', size:'3.8 MB', folder:'Urban', url:'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=800&q=80'},
  {id:3, type:'video', name:'Beach Waves', date:'2026-10-07', size:'28 MB', folder:'Travel', url:'https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4', thumb:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80'},
  {id:4, type:'photo', name:'Mountain Lake', date:'2026-10-06', size:'5.1 MB', folder:'Nature', url:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80'},
  {id:5, type:'photo', name:'Forest Path', date:'2026-10-05', size:'4.7 MB', folder:'Nature', url:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80'},
  {id:6, type:'video', name:'City Drive', date:'2026-10-04', size:'45 MB', folder:'Urban', url:'https://sample-videos.com/video321/mp4/480/big_buck_bunny_480p_1mb.mp4', thumb:'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=400&q=80'},
  {id:7, type:'photo', name:'Desert Dunes', date:'2026-10-03', size:'6.2 MB', folder:'Travel', url:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=800&q=80'},
  {id:8, type:'photo', name:'Aurora', date:'2026-10-02', size:'5.9 MB', folder:'Nature', url:'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800&q=80'},
  {id:9, type:'photo', name:'Street Art', date:'2026-10-01', size:'3.4 MB', folder:'Urban', url:'https://images.unsplash.com/photo-1499781350541-7783f6c6a0c8?w=800&q=80'}
];

let currentFilter = 'all';
let currentSort = 'recent';
let currentItem = null;
let zoomLevel = 1;

function render() {
  let items = [...sampleMedia];
  if (currentFilter === 'photos') items = items.filter(i => i.type === 'photo');
  if (currentFilter === 'videos') items = items.filter(i => i.type === 'video');
  if (currentFilter === 'folders') {
    const folders = [...new Set(sampleMedia.map(i => i.folder))];
    document.getElementById('grid').innerHTML = folders.map(f => `
      <div class="folder-card" onclick="filterFolder('${f}')">
        <i class="fa-solid fa-folder"></i>
        <div>${f}</div>
        <small style="color:var(--muted)">${sampleMedia.filter(i=>i.folder===f).length} items</small>
      </div>
    `).join('');
    return;
  }
  if (currentSort === 'recent') items.sort((a,b) => new Date(b.date) - new Date(a.date));
  if (currentSort === 'oldest') items.sort((a,b) => new Date(a.date) - new Date(b.date));
  if (currentSort === 'name') items.sort((a,b) => a.name.localeCompare(b.name));

  document.getElementById('grid').innerHTML = items.map(item => `
    <div class="media-card" onclick="openItem(${item.id})">
      ${item.type === 'photo' 
        ? `<img src="${item.url}" alt="${item.name}">`
        : `<img src="${item.thumb}" alt="${item.name}"><div class="video-badge"><i class="fa-solid fa-play"></i></div>`
      }
    </div>
  `).join('') || '<div class="empty">No media found</div>';
}

function filterFolder(name) {
  currentFilter = 'all';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.querySelector('[data-filter="all"]').classList.add('active');
  alert(`Opening folder: ${name}\n(In full app this would filter the grid to that folder)`);
  render();
}

function openItem(id) {
  currentItem = sampleMedia.find(i => i.id === id);
  zoomLevel = 1;
  if (currentItem.type === 'photo') {
    document.getElementById('lbImg').src = currentItem.url;
    document.getElementById('lbImg').style.transform = 'scale(1)';
    document.getElementById('lightbox').classList.add('active');
  } else {
    const v = document.getElementById('vidPlayer');
    v.src = currentItem.url;
    v.play();
    document.getElementById('videoModal').classList.add('active');
    setInterval(() => {
      if (v.duration) document.getElementById('prog').style.width = (v.currentTime / v.duration * 100) + '%';
    }, 200);
  }
}

function zoom(factor) {
  zoomLevel *= factor;
  zoomLevel = Math.max(0.5, Math.min(4, zoomLevel));
  document.getElementById('lbImg').style.transform = `scale(${zoomLevel})`;
}
function resetZoom() { zoomLevel = 1; document.getElementById('lbImg').style.transform = 'scale(1)'; }
function vidZoom(f) {
  const v = document.getElementById('vidPlayer');
  v.style.transform = `scale(${(parseFloat(v.style.transform.replace(/[^0-9.]/g,'')) || 1) * f})`;
}

function showInfo() {
  if (!currentItem) return;
  document.getElementById('infoBody').innerHTML = `
    <strong>${currentItem.name}</strong><br>
    Type: ${currentItem.type.toUpperCase()}<br>
    Date: ${currentItem.date}<br>
    Size: ${currentItem.size}<br>
    Folder: ${currentItem.folder}<br>
    Resolution: 4032 × 3024<br>
    Location: Mandeville, JM
  `;
  document.getElementById('infoModal').classList.add('active');
}

function openShare() {
  document.getElementById('shareSheet').classList.add('active');
}

function quickShare(platform) {
  const caption = `Shared from Lumina Ultra Camera Gallery\n${currentItem ? currentItem.name : ''}`;
  const url = currentItem ? currentItem.url : '';
  if (platform === 'whatsapp') {
    window.open(`https://wa.me/?text=${encodeURIComponent(caption + '\n' + url)}`, '_blank');
  } else if (platform === 'facebook') {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(caption)}`, '_blank');
  } else if (platform === 'tiktok') {
    alert('TikTok share:\n' + caption + '\n(In native APK this opens TikTok share sheet)');
  } else {
    if (navigator.share) {
      navigator.share({ title: 'Lumina Gallery', text: caption, url });
    } else {
      alert('Native share:\n' + caption);
    }
  }
  closeAll();
}

function closeAll() {
  document.querySelectorAll('.lightbox, .video-modal, .info-modal, .share-sheet').forEach(el => el.classList.remove('active'));
  document.getElementById('vidPlayer').pause();
}

document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    currentFilter = c.dataset.filter;
    render();
  };
});
document.getElementById('sortSelect').onchange = e => { currentSort = e.target.value; render(); };

document.querySelector('.zone.left').onclick = () => alert('Brightness gesture (left side)');
document.querySelector('.zone.right').onclick = () => alert('Volume gesture (right side)');

render();

setTimeout(() => {
  if (!localStorage.getItem('galleryPerm')) {
    alert('Storage access granted.\nGallery will show your Lumina Camera captures.\n(This is a standalone preview — in the full app it reads from device storage.)');
    localStorage.setItem('galleryPerm', '1');
  }
}, 800);
</script>
</body>
</html>
