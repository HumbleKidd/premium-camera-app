<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina Ultra Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --accent: #00D4FF; --accent2: #FF3D8A; --accent3: #FFB800;
  --bg: #F7F9FC; --glass: rgba(255,255,255,0.85); --text: #0F172A; --muted: #64748B; --danger: #EF4444;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Outfit',system-ui,sans-serif; background:linear-gradient(160deg,#E0F2FE 0%,#F7F9FC 40%,#FCE7F3 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.phone { width:400px; height:860px; background:linear-gradient(145deg,#1e293b,#0f172a); border-radius:52px; padding:12px; box-shadow:0 60px 120px rgba(0,0,0,.35),0 0 0 8px #334155; position:relative; overflow:hidden; }
.island { position:absolute; top:18px; left:50%; transform:translateX(-50%); width:130px; height:36px; background:#000; border-radius:20px; z-index:400; }
.screen { width:100%; height:100%; background:var(--bg); border-radius:40px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
.status { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-weight:700; font-size:15px; }
.viewfinder { flex:1; position:relative; background:#000; overflow:hidden; }
#video,#fallback { width:100%; height:100%; object-fit:cover; transition:filter .2s, transform .25s cubic-bezier(.2,.8,.2,1); will-change:transform; }
#fallback { display:none; }
.grid-overlay { position:absolute; inset:0; pointer-events:none; opacity:0; background-image:linear-gradient(to right,transparent 33.3%,rgba(255,255,255,.4) 33.3%,rgba(255,255,255,.4) 33.5%,transparent 33.5%),linear-gradient(to right,transparent 66.6%,rgba(255,255,255,.4) 66.6%,rgba(255,255,255,.4) 66.8%,transparent 66.8%),linear-gradient(to bottom,transparent 33.3%,rgba(255,255,255,.4) 33.3%,rgba(255,255,255,.4) 33.5%,transparent 33.5%),linear-gradient(to bottom,transparent 66.6%,rgba(255,255,255,.4) 66.6%,rgba(255,255,255,.4) 66.8%,transparent 66.8%); }
.grid-overlay.active { opacity:1; }
.focus-ring { position:absolute; width:72px; height:72px; border:3px solid var(--accent); border-radius:50%; opacity:0; transform:scale(1.3); transition:all .3s; pointer-events:none; box-shadow:0 0 16px var(--accent); }
.focus-ring.show { opacity:1; transform:scale(1); }
.top-bar { position:absolute; top:8px; left:10px; right:10px; display:flex; justify-content:space-between; z-index:30; }
.btn { width:42px; height:42px; border-radius:50%; background:var(--glass); backdrop-filter:blur(16px); border:none; display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--text); cursor:pointer; transition:all .18s; }
.btn.active,.btn:hover { background:var(--accent); color:#fff; transform:scale(1.1); }
.side { position:absolute; right:8px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; z-index:30; }
.pill { background:var(--glass); backdrop-filter:blur(12px); border-radius:18px; padding:8px 6px; text-align:center; cursor:pointer; font-weight:700; font-size:12px; }
.thumb { width:50px; height:50px; border-radius:12px; overflow:hidden; border:2px solid var(--accent); }
.thumb img { width:100%; height:100%; object-fit:cover; }
.bottom { padding:10px 12px 16px; background:linear-gradient(to top,var(--bg),transparent); }
.modes { display:flex; gap:4px; overflow-x:auto; margin-bottom:8px; scrollbar-width:none; }
.modes::-webkit-scrollbar { display:none; }
.mode { min-width:68px; text-align:center; padding:7px 4px; border-radius:14px; background:rgba(255,255,255,.6); font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; }
.mode.active { background:var(--accent); color:#fff; }
.shutter-row { display:flex; align-items:center; justify-content:center; gap:18px; }
.shutter { width:74px; height:74px; border-radius:50%; background:#fff; border:4px solid var(--accent); cursor:pointer; box-shadow:0 0 24px rgba(0,212,255,.4); transition:transform .1s; }
.shutter:active { transform:scale(.92); }
.shutter.recording { border-color:var(--danger); animation:pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 14px rgba(239,68,68,.3); } }
.rec { position:absolute; top:56px; left:50%; transform:translateX(-50%); background:var(--danger); color:#fff; padding:4px 12px; border-radius:12px; font-weight:800; font-size:12px; display:none; z-index:25; }
.modal { position:absolute; inset:0; background:rgba(15,23,42,.7); backdrop-filter:blur(12px); z-index:100; display:none; align-items:center; justify-content:center; }
.modal.active { display:flex; }
.sheet { background:#fff; border-radius:24px; padding:18px; width:92%; max-height:80vh; overflow:auto; }
.scale-pills { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.scale-pills .pill { padding:6px 10px; font-size:12px; }
.update-banner { position:absolute; top:60px; left:12px; right:12px; background:var(--accent); color:#fff; padding:10px 14px; border-radius:14px; font-size:13px; font-weight:600; z-index:60; display:none; text-align:center; cursor:pointer; }
@media (max-width:420px) { .phone { width:100vw; height:100vh; border-radius:0; padding:0; box-shadow:none; } .screen { border-radius:0; } .island { display:none; } }
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="screen">
    <div class="status"><span id="time">9:41</span><div><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></div></div>
    <div class="viewfinder" id="vf">
      <video id="video" autoplay playsinline muted></video>
      <img id="fallback" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=85" alt="">
      <div class="grid-overlay" id="grid"></div>
      <div class="focus-ring" id="focus"></div>
      <div class="rec" id="rec">REC 00:00</div>
      <div class="update-banner" id="updateBanner" onclick="doUpdate()">New update available — Tap to install</div>
      <div class="top-bar">
        <button class="btn" id="flashBtn"><i class="fa-solid fa-bolt"></i></button>
        <button class="btn" id="gridBtn"><i class="fa-solid fa-border-all"></i></button>
        <button class="btn" id="flipBtn"><i class="fa-solid fa-camera-rotate"></i></button>
        <button class="btn" id="settingsBtn"><i class="fa-solid fa-gear"></i></button>
      </div>
      <div class="side">
        <div class="pill" id="scalePill">1×</div>
        <div class="pill" id="qualityPill" title="High Quality Always On">HQ</div>
        <div class="thumb" id="galBtn"><img id="thumb" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=120" alt=""></div>
      </div>
    </div>
    <div class="bottom">
      <div class="modes" id="modes">
        <div class="mode active" data-m="photo">Photo</div>
        <div class="mode" data-m="video">Video</div>
        <div class="mode" data-m="portrait">Portrait</div>
        <div class="mode" data-m="night">Night</div>
        <div class="mode" data-m="pro">Pro</div>
        <div class="mode" data-m="film">Film</div>
        <div class="mode" data-m="burst">Burst</div>
      </div>
      <div class="shutter-row">
        <button class="btn" id="timerBtn">Off</button>
        <div class="shutter" id="shutter"></div>
        <button class="btn" id="hdrBtn">HDR</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="scaleModal">
  <div class="sheet">
    <h3>Camera Scale</h3>
    <p style="font-size:13px;color:var(--muted);margin:6px 0;">Applies to both front & back. High quality always on.</p>
    <div class="scale-pills" id="scalePills">
      <div class="pill" data-s="0.5">0.5× Ultra</div>
      <div class="pill" data-s="1">1×</div>
      <div class="pill" data-s="2">2×</div>
      <div class="pill" data-s="3">3×</div>
      <div class="pill" data-s="5">5×</div>
    </div>
    <button class="btn" style="margin:12px auto;display:block;" onclick="closeM('scaleModal')">Done</button>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="sheet">
    <h3>Lumina Ultra v4.0</h3>
    <p style="font-size:13px;color:var(--muted);margin:8px 0;">Butter-smooth • High quality always • Front & back scales</p>
    <button class="btn" style="margin:6px auto;display:block;" onclick="window.location.href='gallery.html'">Open Full Gallery</button>
    <button class="btn" style="margin:6px auto;display:block;" onclick="checkUpdate()">Check for Updates</button>
    <button class="btn" style="margin:6px auto;display:block;" onclick="closeM('settingsModal')">Close</button>
  </div>
</div>

<canvas id="can" style="display:none;"></canvas>
<script>
const video=document.getElementById('video'), fallback=document.getElementById('fallback'), can=document.getElementById('can'), ctx=can.getContext('2d');
const shutter=document.getElementById('shutter'), thumb=document.getElementById('thumb');
const recEl=document.getElementById('rec');
let stream, mode='photo', facing='environment', recording=false, recSec=0, recInt, mediaRec, chunks=[], zoom=1, hdr=false;
const timers=[0,3,5,10]; let tIdx=0;
const APP_VERSION = '4.0.0';

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    const constraints = {
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
      audio: mode === 'video'
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.style.display = 'block';
    fallback.style.display = 'none';
    apply();
  } catch(e) {
    video.style.display = 'none';
    fallback.style.display = 'block';
  }
}

function apply(){
  let f = '';
  if(mode==='night') f = 'brightness(1.5) contrast(1.2)';
  if(mode==='portrait') f = 'brightness(1.06)';
  if(mode==='film') f = 'sepia(.25) contrast(1.08)';
  if(hdr) f += ' contrast(1.08) saturate(1.05)';
  video.style.filter = f || 'none';
  video.style.transform = `scale(${zoom})`;
  fallback.style.filter = f || 'none';
  fallback.style.transform = `scale(${zoom})`;
}

function capture(){
  const src = video.style.display !== 'none' ? video : fallback;
  can.width = src.videoWidth || 1080;
  can.height = src.videoHeight || 1440;
  ctx.filter = video.style.filter || 'none';
  ctx.drawImage(src, 0, 0, can.width, can.height);
  const url = can.toDataURL('image/jpeg', 0.97);
  thumb.src = url;
  const a = document.createElement('a');
  a.href = url; a.download = `lumina_${Date.now()}.jpg`; a.click();
  document.getElementById('vf').style.background = '#fff';
  setTimeout(()=> document.getElementById('vf').style.background = '#000', 60);
}

async function toggleRec(){
  if(!recording){
    recording = true; shutter.classList.add('recording'); recEl.style.display = 'block'; recSec = 0; chunks = [];
    try {
      mediaRec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      mediaRec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      mediaRec.onstop = () => {
        const blob = new Blob(chunks, {type:'video/webm'});
        const u = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = u; a.download = `lumina_vid_${Date.now()}.webm`; a.click();
        URL.revokeObjectURL(u);
      };
      mediaRec.start();
    } catch(e) {}
    recInt = setInterval(()=>{ recSec++; recEl.textContent = `REC ${String(Math.floor(recSec/60)).padStart(2,'0')}:${String(recSec%60).padStart(2,'0')}`; },1000);
  } else {
    recording = false; shutter.classList.remove('recording'); recEl.style.display = 'none'; clearInterval(recInt);
    if(mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  }
}

document.getElementById('shutter').onclick = () => {
  if(mode === 'video') return toggleRec();
  if(mode === 'burst') { for(let i=0;i<4;i++) setTimeout(capture, i*120); return; }
  const d = timers[tIdx];
  if(d) { let c=d; const i=setInterval(()=>{ if(c<=0){ clearInterval(i); capture(); } c--; },800); } else capture();
};

document.getElementById('flipBtn').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  const was = recording;
  if(was && mediaRec) mediaRec.stop();
  await startCam();
  if(was) setTimeout(toggleRec, 350);
};

document.getElementById('flashBtn').onclick = function(){ this.classList.toggle('active'); };
document.getElementById('gridBtn').onclick = function(){ document.getElementById('grid').classList.toggle('active'); this.classList.toggle('active'); };
document.getElementById('hdrBtn').onclick = function(){ hdr=!hdr; this.classList.toggle('active',hdr); apply(); };
document.getElementById('timerBtn').onclick = function(){ tIdx=(tIdx+1)%4; this.textContent = timers[tIdx] ? timers[tIdx]+'s' : 'Off'; this.classList.toggle('active', timers[tIdx]>0); };
document.getElementById('scalePill').onclick = () => document.getElementById('scaleModal').classList.add('active');
document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('active');
document.getElementById('galBtn').onclick = () => window.location.href = 'gallery.html';

document.querySelectorAll('.mode').forEach(m => m.onclick = () => {
  document.querySelectorAll('.mode').forEach(x => x.classList.remove('active'));
  m.classList.add('active'); mode = m.dataset.m; apply();
});

document.querySelectorAll('#scalePills .pill').forEach(p => p.onclick = () => {
  zoom = parseFloat(p.dataset.s);
  document.getElementById('scalePill').textContent = zoom + '×';
  apply();
  closeM('scaleModal');
});

document.getElementById('vf').onclick = e => {
  if(e.target.closest('.btn,.pill,.thumb')) return;
  const r = document.getElementById('vf').getBoundingClientRect();
  const f = document.getElementById('focus');
  f.style.left = (e.clientX - r.left - 36) + 'px';
  f.style.top = (e.clientY - r.top - 36) + 'px';
  f.classList.add('show');
  setTimeout(() => f.classList.remove('show'), 600);
};

function closeM(id){ document.getElementById(id).classList.remove('active'); }

function checkUpdate(){
  const latest = '4.0.1';
  if(latest !== APP_VERSION){
    document.getElementById('updateBanner').style.display = 'block';
    document.getElementById('updateBanner').textContent = `Update ${latest} available — Tap to install`;
  } else {
    alert('You are on the latest version (' + APP_VERSION + ')');
  }
  closeM('settingsModal');
}
function doUpdate(){
  alert('Installing update...\n(In a real PWA/APK this downloads the new package and reloads seamlessly without deleting the app.)');
  document.getElementById('updateBanner').style.display = 'none';
  setTimeout(() => location.reload(), 800);
}

startCam();
setInterval(() => { document.getElementById('time').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }, 15000);
setTimeout(checkUpdate, 2000);
</script>
</body>
</html>
